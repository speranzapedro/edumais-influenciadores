name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint e formatação (Biome)
        run: pnpm biome ci .
      - name: Tipos
        run: pnpm typecheck
      - name: Testes unitários e de componentes, com cobertura mínima
        run: pnpm test:cobertura
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  integracao:
    name: Integração (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Subir o Supabase local (aplica as migrations)
        id: supabase
        run: pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      # Os passos seguintes rodam mesmo se um anterior falhar: cada um aponta um problema diferente.
      - name: Lint do schema
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm exec supabase db lint --level error --fail-on error
      - name: Tipos escritos à mão batem com o schema
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm db:tipos
      - name: Testes de integração do @edu/db, com cobertura mínima
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm test:int:cobertura
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-integracao
          path: coverage-integracao/
          retention-days: 14
      - name: Tipos gerados (para comparar em caso de divergência)
        if: failure() && steps.supabase.outcome == 'success'
        run: |
          grep -n -A3 "export type Json" packages/db/tipos/database.gerado.ts || true
          grep -n -E "redes|eventos|revisoes" packages/db/tipos/database.gerado.ts | head -20 || true
      - name: Logs do Supabase em caso de falha
        if: failure()
        run: docker ps -a && docker logs supabase_db_edumais-influenciadores 2>&1 | tail -100
