<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#f5f5fb;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;color:#1d1a3a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5fb;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:24px;padding:32px">
            <tr>
              <td style="font-size:22px;font-weight:800;color:#1d1a3a">Edu<span style="color:#6c5ce7">+</span></td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:20px;font-weight:800;line-height:1.3">Vamos criar uma nova senha?</td>
            </tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6;color:#4b4868">
                Recebemos um pedido para redefinir a senha da sua conta na Edu+. Toque no botão abaixo para escolher a nova senha.
                O link só pode ser usado uma vez. Se expirar, solicite outro.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block;background:#6c5ce7;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 24px;border-radius:16px"
                  >Criar nova senha</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:13px;line-height:1.6;color:#8b8aa6">
                Não pediu a troca? Pode ignorar este e-mail: sua senha continua a mesma.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
